name: Format

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Only Prettier, not the whole dependency tree: the exact version yarn.lock pins, so the
      # check matches `yarn format` locally.
      - name: Install Prettier
        run: |
          version=$(awk '/^prettier@/ { getline; gsub(/"/, "", $2); print $2; exit }' yarn.lock)
          yarn global add "prettier@$version" --silent
          yarn global bin >> "$GITHUB_PATH"
      - run: prettier --check .
