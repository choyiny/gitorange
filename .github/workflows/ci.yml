          key: build-${{ github.sha }}
      - name: Stage config
        run: cp wrangler.jsonc.ci wrangler.jsonc && cp .dev.vars.example .dev.vars
      - name: Install and build (cache miss)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile && yarn build
      - name: Test
        run: >-
          yarn test
          worker/src/__tests__/repos-pulls.test.ts
          worker/src/__tests__/protected-branches.test.ts
          worker/src/__tests__/setup-invites.test.ts
          worker/src/__tests__/teams-visibility.test.ts
          worker/src/__tests__/admin-setup.test.ts
          worker/src/__tests__/settings.test.ts
          worker/src/__tests__/commit-emails.test.ts
          worker/src/__tests__/smoke.test.ts
          worker/src/__tests__/live.test.ts
          worker/src/__tests__/live-open.test.ts
          worker/src/__tests__/usage.test.ts
          worker/src/__tests__/insights.test.ts
          worker/src/__tests__/ai-gateway.test.ts
          worker/src/__tests__/ai-rate-limit.test.ts
          worker/src/__tests__/mcp.test.ts
          worker/src/__tests__/mcp-moderator.test.ts
          worker/src/__tests__/mcp-agents.test.ts
          worker/src/__tests__/agents-config.test.ts
          worker/src/__tests__/agents-template.test.ts
          worker/src/__tests__/agents-admin.test.ts
          worker/src/__tests__/agents-repos.test.ts
          worker/src/__tests__/agents-auth.test.ts
          worker/src/__tests__/agents-refresh.test.ts
          worker/src/__tests__/agents-profile.test.ts
          worker/src/__tests__/agents-presets.test.ts
          worker/src/__tests__/audit.test.ts
          worker/src/__tests__/sessions.test.ts
          worker/src/__tests__/branches.test.ts
