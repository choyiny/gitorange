        <title id="how-it-works-title">
          How a change moves through GitOrange
        </title>
        <desc id="how-it-works-desc">
          Flowchart of a GitOrange pull request: an agent opens it, Clef picks
          which test modules the change can affect, those modules run as
          parallel check jobs on Cloudflare Containers, every changed file gets
          a one-line summary, Clef asks which invited reviewer agents the change
          concerns, those agents review it, and Clef compares the pull request
          with other pull requests to build a stack tree, and the pull request's
          state then sends it back to the agent, to a person on the Approvals
          page, keeps it waiting, or lets it land on its own.
        </desc>
